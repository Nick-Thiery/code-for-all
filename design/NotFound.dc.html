<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap"><style>body{margin:0}a{color:var(--accent)}a:hover{color:var(--text)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></helmet>
<div style="background:var(--bg);color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <dc-import name="SiteHeader" mobile="{{ mobile }}" dark="{{ dark }}" resume="Lesson 4, Using AI safely and honestly" hint-size="100%,116px"></dc-import>
  <main style="padding:0 var(--gut)">
    <div style="max-width:640px;margin:0 auto;padding:var(--sec) 0;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
      <div aria-hidden="true" style="position:relative;width:100%;max-width:400px;height:96px;margin-bottom:12px">
        <span style="position:absolute;left:14px;width:calc(64% - 14px);top:44px;height:8px;border-radius:4px;background:var(--accent)"></span>
        <span style="position:absolute;left:64%;width:calc(24% - 22px);top:46px;border-top:4px dashed var(--pip)"></span>
        <span style="position:absolute;left:0;top:34px;width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:6px solid var(--accent);background:var(--bg)"></span>
        <span style="position:absolute;left:calc(32% - 14px);top:34px;width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:6px solid var(--accent);background:var(--bg)"></span>
        <span style="position:absolute;left:calc(64% - 14px);top:34px;width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:6px solid var(--accent);background:var(--bg)"></span>
        <span style="position:absolute;right:0;top:12px;width:72px;height:72px;box-sizing:border-box;border-radius:50%;border:3px dashed var(--pip);background:var(--bg);display:grid;place-items:center;font-family:Recursive,sans-serif;font-variation-settings:'CASL' 1;font-weight:700;font-size:32px;color:var(--muted)">?</span>
      </div>
      <span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.6;font-weight:700;font-size:15px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">Page not found</span>
      <h1 style="margin:0;font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.5;font-weight:700;font-size:var(--h1);line-height:1.12;text-wrap:balance">This stop isn't on the line.</h1>
      <p style="margin:0;max-width:28em;text-wrap:pretty">The page you're looking for doesn't exist, or it has moved. Your progress is safe.</p>
      <a href="#" style="margin-top:8px;min-height:52px;display:inline-flex;align-items:center;padding:0 28px;box-sizing:border-box;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:19px;text-decoration:none" style-hover="filter:brightness(1.15)">Back to the course</a>
    </div>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,100px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
