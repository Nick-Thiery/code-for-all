<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside aria-label="Key term" style="border:1.5px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:4px;color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <span style="font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--muted)">Key term</span>
  <dfn style="font-style:normal;font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.5;font-weight:700;font-size:22px;line-height:1.3;color:var(--accent)">{{ term }}</dfn>
  <p style="margin:0;text-wrap:pretty">{{ def }}</p>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:140},&quot;term&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Model&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;def&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The trained AI system that generates the text.&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
