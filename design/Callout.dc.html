<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isTip }}" hint-placeholder-val="{{ true }}">
<aside aria-label="Tip" style="background:var(--tint);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <span style="display:flex;align-items:center;gap:8px"><svg width="16" height="18" viewBox="0 0 24 26" aria-hidden="true"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--deco)"></polygon></svg><span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.6;font-weight:700;font-size:15px;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">Tip</span></span>
  <p style="margin:0;text-wrap:pretty">{{ body }}</p>
</aside>
</sc-if>
<sc-if value="{{ isHeads }}" hint-placeholder-val="{{ false }}">
<aside aria-label="Heads up" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <span style="display:flex;align-items:center;gap:8px"><svg width="18" height="20" viewBox="0 0 24 26" aria-hidden="true"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round"></polygon><text x="12" y="17.6" text-anchor="middle" style="font:700 13px 'Atkinson Hyperlegible Next',sans-serif;fill:var(--text)">!</text></svg><span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.6;font-weight:700;font-size:15px;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--text)">Heads up</span></span>
  <p style="margin:0;text-wrap:pretty">{{ body }}</p>
</aside>
</sc-if>
<sc-if value="{{ isTry }}" hint-placeholder-val="{{ false }}">
<aside aria-label="Try it" style="background:var(--surface);border:2px dashed var(--deco);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <span style="display:flex;align-items:center;gap:8px"><svg width="18" height="20" viewBox="0 0 24 26" aria-hidden="true"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round"></polygon><path d="M9.5 9l5 4-5 4" style="fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"></path></svg><span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.6;font-weight:700;font-size:15px;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">Try it</span></span>
  <p style="margin:0;text-wrap:pretty">{{ body }}</p>
</aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:140},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tip&quot;,&quot;headsup&quot;,&quot;tryit&quot;],&quot;default&quot;:&quot;tip&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;If an answer isn't what you wanted, ask again in a different way.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || "tip";
    return { isTip: k === "tip", isHeads: k === "headsup", isTry: k === "tryit", body: this.props.body || "" };
  }
}
</script>
</body>
</html>
