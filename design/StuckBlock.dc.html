<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <button type="button" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:transparent;border:0;color:var(--text);font-family:inherit;text-align:left;cursor:pointer" style-hover="background:var(--surface2)">
    <span style="display:flex;flex-direction:column"><span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.5;font-weight:700;font-size:20px;line-height:1.3">Stuck?</span><span style="font-size:16px;line-height:1.5;color:var(--muted)">Common fixes for this lesson</span></span>
    <span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-size:20px;line-height:1;font-weight:700;color:var(--accent)">{{ sign }}</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid var(--border);padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="3"><div><p style="margin:0;font-weight:700">{{ it.q }}</p><p style="margin:2px 0 0">{{ it.a }}</p></div></sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:360},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{q:string,a:string}[]&quot;}}">
const DEF = [
  { q: "Nothing happens when I type the command.", a: "That's expected for now. You'll install Claude Code in Lesson 5, and then it will work." },
  { q: "“Model” and “AI” sound like the same thing.", a: "Close. The AI is the whole tool you talk to. The model is the part inside that predicts the words." },
  { q: "The practice box won't let me type any more.", a: "There's a limit of 1,200 characters. Try cutting a sentence. Shorter prompts often work better anyway." }
];
class Component extends DCLogic {
  state = { open: !!this.props.open };
  renderVals() {
    return { open: this.state.open, sign: this.state.open ? "−" : "+", items: this.props.items || DEF,
      toggle: () => this.setState(s => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
