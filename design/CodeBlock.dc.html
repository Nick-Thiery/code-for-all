<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<figure style="margin:0;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface2);color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif">
  <figcaption style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border);font-size:15px;line-height:1.5;color:var(--muted)"><span style="font-family:'Atkinson Hyperlegible Mono',monospace">index.html</span><span>HTML</span></figcaption>
  <div style="padding:14px 0;overflow-x:auto">
    <code style="display:grid;grid-template-columns:auto 1fr;column-gap:16px;font-family:'Atkinson Hyperlegible Mono',ui-monospace,monospace;font-size:16px;line-height:1.8">
      <span aria-hidden="true" style="padding-left:16px;text-align:right;color:var(--c-com);user-select:none">1</span><span style="padding-right:16px;white-space:pre;color:var(--c-com);font-style:italic">&lt;!-- Claude writes this one token at a time --&gt;</span>
      <span aria-hidden="true" style="padding-left:16px;text-align:right;color:var(--c-com);user-select:none">2</span><span style="padding-right:16px;white-space:pre"><span style="color:var(--c-tag)">&lt;h1</span> <span style="color:var(--c-attr)">class</span>=<span style="color:var(--c-str)">"name"</span><span style="color:var(--c-tag)">&gt;</span>Hi, I'm Aisyah<span style="color:var(--c-tag)">&lt;/h1&gt;</span></span>
      <span aria-hidden="true" style="padding-left:16px;text-align:right;color:var(--c-com);user-select:none">3</span><span style="padding-right:16px;white-space:pre"><span style="color:var(--c-tag)">&lt;p&gt;</span>I like cats, badminton and drawing.<span style="color:var(--c-tag)">&lt;/p&gt;</span></span>
      <span aria-hidden="true" style="padding-left:16px;text-align:right;color:var(--c-com);user-select:none">4</span><span style="padding-right:16px;white-space:pre"><span style="color:var(--c-tag)">&lt;img</span> <span style="color:var(--c-attr)">src</span>=<span style="color:var(--c-str)">"mochi.jpg"</span> <span style="color:var(--c-attr)">alt</span>=<span style="color:var(--c-str)">"My cat, Mochi"</span><span style="color:var(--c-tag)">&gt;</span></span>
    </code>
  </div>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:220}}"></script>
</body>
</html>
