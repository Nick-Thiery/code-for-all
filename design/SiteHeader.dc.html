<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:var(--bg);color:var(--text);border-bottom:1px solid var(--border);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:16px;line-height:1.4">
  <div style="max-width:1200px;margin:0 auto;padding:0 var(--gut);min-height:68px;display:flex;align-items:center;gap:12px">
    <a href="#" aria-label="Code for All home" style="flex:none;display:flex;align-items:center;min-height:44px;border-radius:8px;text-decoration:none">
      <sc-if value="{{ logoFull }}" hint-placeholder-val="{{ true }}"><img src="assets/cfa-logo.png" alt="" style="display:block;height:44px;width:auto"></sc-if>
      <sc-if value="{{ logoMark }}" hint-placeholder-val="{{ false }}"><span style="display:block;width:35px;height:44px;overflow:hidden"><img src="assets/cfa-logo.png" alt="" style="display:block;height:44px;width:auto"></span></sc-if>
      <sc-if value="{{ logoDark }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:8px">
        <svg width="36" height="40" viewBox="0 0 24 26" aria-hidden="true"><polygon points="12,1 23,7.25 23,18.75 12,25 1,18.75 1,7.25" style="fill:var(--accent)"></polygon><text x="12" y="16.4" text-anchor="middle" style="font:700 9px 'Atkinson Hyperlegible Mono',monospace;fill:var(--on-accent)">&lt;/&gt;</text></svg>
        <sc-if value="{{ wordmark }}"><span style="display:flex;flex-direction:column;line-height:1;gap:2px"><span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 1;font-weight:500;font-size:23px;letter-spacing:.03em;color:var(--deco)">CODE</span><span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 1;font-weight:500;font-size:16px;color:var(--text)">For All</span></span></sc-if>
      </span></sc-if>
    </a>
    <sc-if value="{{ lessonDesk }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:12px;margin-left:12px;padding-left:20px;border-left:1px solid var(--border);min-height:36px">
        <span style="font-weight:700;white-space:nowrap">{{ lessonLabel }}</span>
        <span aria-hidden="true" style="display:flex;align-items:center;gap:4px">
          <sc-for list="{{ pips }}" as="p" hint-placeholder-count="7">
            <sc-if value="{{ p.done }}"><svg width="14" height="15" viewBox="0 0 24 26"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--accent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round"></polygon></svg></sc-if>
            <sc-if value="{{ p.cur }}"><svg width="19" height="21" viewBox="0 0 24 26"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--tint);stroke:var(--accent);stroke-width:3;stroke-linejoin:round"></polygon></svg></sc-if>
            <sc-if value="{{ p.curDone }}"><svg width="19" height="21" viewBox="0 0 24 26" style="animation:cfaPop 450ms cubic-bezier(.3,1.4,.5,1) both"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--accent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round"></polygon></svg></sc-if>
            <sc-if value="{{ p.todo }}"><svg width="14" height="15" viewBox="0 0 24 26"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-linejoin:round"></polygon></svg></sc-if>
          </sc-for>
        </span>
      </div>
    </sc-if>
    <div style="flex:1"></div>
    <nav aria-label="Main" style="display:flex;align-items:center;gap:4px">
      <sc-if value="{{ courseOn }}" hint-placeholder-val="{{ false }}"><a href="#" aria-current="page" style="min-height:44px;display:flex;align-items:center;padding:0 10px;border-radius:10px;background:var(--tint);color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap">Course</a></sc-if>
      <sc-if value="{{ courseOff }}" hint-placeholder-val="{{ true }}"><a href="#" style="min-height:44px;display:flex;align-items:center;padding:0 10px;border-radius:10px;color:var(--text);font-weight:700;text-decoration:none;white-space:nowrap" style-hover="background:var(--surface2)">Course</a></sc-if>
      <sc-if value="{{ runOn }}" hint-placeholder-val="{{ false }}"><a href="#" aria-current="page" style="min-height:44px;display:flex;align-items:center;padding:0 10px;border-radius:10px;background:var(--tint);color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap">Run a session</a></sc-if>
      <sc-if value="{{ runOff }}" hint-placeholder-val="{{ true }}"><a href="#" style="min-height:44px;display:flex;align-items:center;padding:0 10px;border-radius:10px;color:var(--text);font-weight:700;text-decoration:none;white-space:nowrap" style-hover="background:var(--surface2)">Run a session</a></sc-if>
    </nav>
    <button type="button" aria-label="{{ toggleAria }}" style="flex:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;border:1.5px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font-family:inherit;font-weight:700;font-size:16px;cursor:pointer" style-hover="border-color:var(--accent)">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" style="fill:none;stroke:currentColor;stroke-width:2"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" style="fill:currentColor"></path></svg>
      <sc-if value="{{ showToggleLabel }}" hint-placeholder-val="{{ true }}"><span>{{ toggleText }}</span></sc-if>
    </button>
  </div>
  <sc-if value="{{ lessonMob }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid var(--border);padding:0 var(--gut);min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span style="font-size:15px;font-weight:700">{{ lessonLabel }}</span>
      <span aria-hidden="true" style="display:flex;align-items:center;gap:4px">
        <sc-for list="{{ pips }}" as="p" hint-placeholder-count="7">
          <sc-if value="{{ p.done }}"><svg width="13" height="14" viewBox="0 0 24 26"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--accent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round"></polygon></svg></sc-if>
          <sc-if value="{{ p.cur }}"><svg width="17" height="19" viewBox="0 0 24 26"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--tint);stroke:var(--accent);stroke-width:3;stroke-linejoin:round"></polygon></svg></sc-if>
          <sc-if value="{{ p.curDone }}"><svg width="17" height="19" viewBox="0 0 24 26" style="animation:cfaPop 450ms cubic-bezier(.3,1.4,.5,1) both"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:var(--accent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round"></polygon></svg></sc-if>
          <sc-if value="{{ p.todo }}"><svg width="13" height="14" viewBox="0 0 24 26"><polygon points="12,1.5 22.5,7.5 22.5,18.5 12,24.5 1.5,18.5 1.5,7.5" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-linejoin:round"></polygon></svg></sc-if>
        </sc-for>
      </span>
    </div>
  </sc-if>
  <sc-if value="{{ hasResume }}" hint-placeholder-val="{{ false }}">
    <div style="background:var(--tint);border-top:1px solid var(--border)">
      <div style="max-width:1200px;margin:0 auto;padding:0 var(--gut)">
        <a href="#" style="min-height:48px;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;padding:6px 0;font-size:17px;color:var(--text);text-decoration:none">
          <span>Pick up where you left off:</span>
          <strong style="color:var(--accent);text-decoration:underline;text-underline-offset:4px">{{ resume }} →</strong>
        </a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lesson&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;done&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;course&quot;,&quot;run&quot;,&quot;&quot;],&quot;default&quot;:&quot;course&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;resume&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, m = !!p.mobile, d = !!p.dark, lesson = !!p.lesson;
    const cur = +p.current || 0, done = +p.done || 0;
    const pips = [1, 2, 3, 4, 5, 6, 7].map(i => {
      const isD = i <= done, isC = i === cur;
      return { done: isD && !isC, cur: isC && !isD, curDone: isC && isD, todo: !isD && !isC };
    });
    return {
      logoFull: !d && !m, logoMark: !d && m, logoDark: d, wordmark: !m,
      lessonDesk: lesson && !m, lessonMob: lesson && m,
      lessonLabel: m ? `Lesson ${cur} of 7` : `Part 1 · Lesson ${cur} of 7`, pips,
      courseOn: p.active === "course", courseOff: p.active !== "course",
      runOn: p.active === "run", runOff: p.active !== "run",
      showToggleLabel: !m, toggleText: d ? "Light" : "Dark",
      toggleAria: d ? "Switch to light mode" : "Switch to dark mode",
      hasResume: !!p.resume && !lesson, resume: p.resume || ""
    };
  }
}
</script>
</body>
</html>
