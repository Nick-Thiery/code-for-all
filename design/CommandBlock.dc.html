<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--term-bg);border:1.5px solid var(--term-border);border-radius:12px;overflow:hidden;color:#F2F5F8;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 18px;border-bottom:1px solid #2E3743">
    <span style="font-size:15px;font-weight:700;letter-spacing:.03em;color:#A9B3BF">Terminal</span>
    <button type="button" onClick="{{ copy }}" style="min-height:44px;min-width:100px;padding:0 16px;border:2px solid #F2F5F8;border-radius:10px;background:transparent;color:#F2F5F8;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer" style-hover="background:#2E3743" style-focus="outline:3px solid #47B3FF;outline-offset:2px">{{ copyLabel }}</button>
  </div>
  <div style="padding:18px;display:flex;gap:12px;overflow-x:auto;font-family:'Atkinson Hyperlegible Mono',ui-monospace,monospace;font-size:18px;line-height:1.5">
    <span aria-hidden="true" style="color:#A9B3BF;user-select:none">$</span>
    <code style="font-family:inherit;white-space:pre">{{ command }}</code>
  </div>
  <span aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">{{ announce }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:130},&quot;command&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;claude --version&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { copied: false };
  copy = () => {
    try { navigator.clipboard && navigator.clipboard.writeText(this.props.command || "claude --version").catch(() => {}); } catch (e) {}
    this.setState({ copied: true });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ copied: false }), 2000);
  };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    return { command: this.props.command || "claude --version", copy: this.copy,
      copyLabel: this.state.copied ? "✓ Copied" : "Copy", announce: this.state.copied ? "Copied to clipboard" : "" };
  }
}
</script>
</body>
</html>
