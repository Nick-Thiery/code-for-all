<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap"><style>body{margin:0}a{color:var(--accent)}a:hover{color:var(--text)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></helmet>
<div style="background:var(--bg);color:var(--text);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:19px;line-height:1.6">
  <dc-import name="SiteHeader" mobile="{{ mobile }}" dark="{{ dark }}" active="course" hint-size="100%,68px"></dc-import>
  <main style="padding:0 var(--gut)">
    <div style="max-width:640px;margin:0 auto;padding:var(--sec) 0;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
      <svg width="170" height="162" viewBox="-80 -76 160 152" aria-hidden="true" style="margin-bottom:8px">
        <polygon points="-25,-69.3 -2.5,-56.3 -2.5,-30.3 -25,-17.3 -47.5,-30.3 -47.5,-56.3" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"></polygon>
        <polygon points="25,-69.3 47.5,-56.3 47.5,-30.3 25,-17.3 2.5,-30.3 2.5,-56.3" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"></polygon>
        <polygon points="50,-26 72.5,-13 72.5,13 50,26 27.5,13 27.5,-13" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"></polygon>
        <polygon points="25,17.3 47.5,30.3 47.5,56.3 25,69.3 2.5,56.3 2.5,30.3" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"></polygon>
        <polygon points="-25,17.3 -2.5,30.3 -2.5,56.3 -25,69.3 -47.5,56.3 -47.5,30.3" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"></polygon>
        <polygon points="-50,-26 -27.5,-13 -27.5,13 -50,26 -72.5,13 -72.5,-13" style="fill:none;stroke:var(--pip);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"></polygon>
        <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" style="fill:var(--tint);stroke:var(--deco);stroke-width:2.5;stroke-linejoin:round"></polygon>
      </svg>
      <span style="font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.6;font-weight:700;font-size:15px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">Part 2</span>
      <h1 style="margin:0;font-family:Recursive,sans-serif;font-variation-settings:'CASL' 0.5;font-weight:700;font-size:var(--h1);line-height:1.12">Coming soon</h1>
      <p style="margin:0;max-width:28em;text-wrap:pretty">We're building Part 2 now. It picks up where Part 1 ends, with bigger things to build.</p>
      <p style="margin:0;max-width:28em;font-size:16px;line-height:1.5;color:var(--muted);text-wrap:pretty">There's nothing to sign up for. Just check back. Your Part 1 progress stays saved on this device.</p>
      <a href="#" style="margin-top:8px;min-height:52px;display:inline-flex;align-items:center;padding:0 28px;box-sizing:border-box;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:19px;text-decoration:none" style-hover="filter:brightness(1.15)">Back to the course</a>
    </div>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,100px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
