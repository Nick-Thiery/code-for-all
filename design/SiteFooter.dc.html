<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="border-top:1px solid var(--border);background:var(--bg);color:var(--muted);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:16px;line-height:1.5">
  <div style="max-width:1200px;margin:0 auto;padding:28px var(--gut) 36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px">
    <p style="margin:0;max-width:34em;text-wrap:pretty">Made by students at Code for All, a service club at Singapore American School.</p>
    <nav aria-label="Footer" style="display:flex;flex-wrap:wrap;gap:0 4px;margin:0 -10px">
      <a href="#" style="min-height:44px;display:flex;align-items:center;padding:0 10px;color:var(--muted);text-underline-offset:3px" style-hover="color:var(--text)">About</a>
      <a href="#" style="min-height:44px;display:flex;align-items:center;padding:0 10px;color:var(--muted);text-underline-offset:3px" style-hover="color:var(--text)">Run a session</a>
      <a href="#" style="min-height:44px;display:flex;align-items:center;padding:0 10px;color:var(--muted);text-underline-offset:3px" style-hover="color:var(--text)">Contact</a>
    </nav>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120}}"></script>
</body>
</html>
